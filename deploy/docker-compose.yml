# Precedent Graph: FalkorDB + app + Caddy (automatic HTTPS)
name: precedent-graph

services:
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    ports:
      # FalkorDB Browser, reachable only through an SSH tunnel:  ssh -L 3000:localhost:3000 root@<server>
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: precedents
      ALLOW_EMBEDDED_FALLBACK: "0"
      FALKORDB_CONNECT_TRIES: "120"
      GRAPH_DUMP: /srv/data/precedents_full.json.xz
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 300s

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  falkordb_data:
  caddy_data:
  caddy_config:
